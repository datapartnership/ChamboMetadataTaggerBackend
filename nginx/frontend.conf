server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Local-dev variant of the frontend's nginx.conf: the CSP additionally allows
    # Keycloak (localhost:8081), and HSTS is left out since this is served over plain http.
    # /api is proxied to the api container, so the browser stays same-origin (no CORS);
    # build the frontend with VITE_API_URL=/.
    set $csp "default-src 'self'; img-src 'self' data: blob: https://*.blob.core.windows.net; media-src 'self' blob: https://*.blob.core.windows.net; frame-src 'self' http://localhost:8081 https://*.blob.core.windows.net https://login.microsoftonline.com; connect-src 'self' http://localhost:8081 https://login.microsoftonline.com https://*.blob.core.windows.net; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
